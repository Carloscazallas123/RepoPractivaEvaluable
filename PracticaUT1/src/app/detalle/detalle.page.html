<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Detalle curioso</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">detalle</ion-title>
    </ion-toolbar>
  </ion-header>
  <div class="ContenedorPortada">
    <div class="ContenedorDescripcion">
      <div class="ContenedorTexto">
         <h1>{{titulo}}
          </h1>
      </div>
      <div class="ContenedorCarta">
        
        <ion-card class="Carta">
          <ion-title id="Cartatitulo">
          </ion-title>
          <ion-card-content id="Cartacontenido">
              <p>{{detalle}}</p>
              <div style="display: flex;">
                <div style="margin-top: 50px;">
                  <ion-button style="--background: rgb(230, 177, 71); --color: rgb(5, 5, 5);"
                  (click)="irTab2()">
                    Volver
                  </ion-button>
                </div>
              </div>
          </ion-card-content>
        </ion-card>
      
      </div>
    </div>
    <div class="ContenedorImagen">
      <img src="./../../assets/img/Hercules.png" alt="Hercules">
    </div>
  </div>
</ion-content>
